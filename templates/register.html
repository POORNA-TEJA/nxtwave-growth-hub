<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Register | AI Workshop
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <section class="registration-section">

        <div class="registration-container">

            <p class="tag">
                FREE WORKSHOP
            </p>

            <h1>
                Register for the AI Workshop
            </h1>

            <p class="form-description">
                Enter your details to reserve your place.
            </p>


            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="college">
                        College / University
                    </label>

                    <input
                        type="text"
                        id="college"
                        name="college"
                        placeholder="Enter your college"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        WhatsApp Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your WhatsApp number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="referred_by">

                        Referral Code

                        <span>
                            (Optional)
                        </span>

                    </label>

                    <input
                        type="text"
                        id="referred_by"
                        name="referred_by"
                        value="{{ referred_by or '' }}"
                        placeholder="Example: TEJA1234"
                    >

                    {% if referred_by %}

                        <small class="referral-detected">
                            Referral code detected automatically.
                        </small>

                    {% endif %}

                </div>


                <button
                    type="submit"
                    class="primary-btn register-button">

                    Register for Free

                </button>

            </form>


            <a
                href="/"
                class="back-link">

                ← Back to Workshop

            </a>

        </div>

    </section>

</body>

</html>
