<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Campus Growth</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <section class="admin-login-section">

        <div class="admin-login-container">

            <div class="admin-login-icon">
                🔐
            </div>

            <p class="tag">
                CAMPAIGN CONTROL CENTER
            </p>

            <h1>
                Admin Login
            </h1>

            <p class="admin-login-description">
                Sign in to access the campaign dashboard
                and growth analytics.
            </p>


            {% if error %}

            <div class="admin-login-error">
                {{ error }}
            </div>

            {% endif %}


            <form method="POST"
                  action="{{ url_for('admin_login') }}">


                <div class="admin-login-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter admin username"
                        required
                        autocomplete="username">

                </div>


                <div class="admin-login-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        required
                        autocomplete="current-password">

                </div>


                <button
                    type="submit"
                    class="admin-login-button">

                    Sign In

                </button>

            </form>


            <a
                href="{{ url_for('home') }}"
                class="admin-login-back">

                ← Back to Workshop

            </a>

        </div>

    </section>

</body>

</html>
